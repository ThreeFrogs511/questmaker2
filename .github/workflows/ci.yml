name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci

      - name: Run unit tests
        run: |
          bash -lc 'shopt -s globstar nullglob; npx tsx --test test/unit/**/*.test.ts'

  integration:
    runs-on: ubuntu-latest
    needs: unit

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: questmaker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docker -d questmaker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Seed database schema
        env:
          PGPASSWORD: docker
        run: |
          psql -h localhost -U docker -d questmaker -c "
            CREATE TABLE IF NOT EXISTS quests (
              quest_id  INTEGER GENERATED ALWAYS AS IDENTITY,
              body      VARCHAR(300) NOT NULL,
              completed BOOLEAN NOT NULL,
              user_id   INTEGER NOT NULL,
              CONSTRAINT quests_pkey PRIMARY KEY (quest_id)
            );
          "

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://docker:docker@localhost:5432/questmaker
          JWT_SECRET: test-jwt-secret-for-ci
        run: |
          bash -lc 'shopt -s globstar nullglob; npx tsx --test test/integration/**/*.test.ts'
