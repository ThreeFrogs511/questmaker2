name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - run: npm run test

  integration:
    runs-on: ubuntu-latest
    needs: unit

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: questmaker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docker -d questmaker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://docker:docker@localhost:5432/questmaker
        run: npm run test:integration
