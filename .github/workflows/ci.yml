name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci

      - name: Run unit tests
        run: |
          bash -lc 'shopt -s globstar nullglob; npx tsx --test test/unit/**/*.test.ts'

  integration:
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      # Démarre Postgres via ton docker-compose + charge db.sql (docker-entrypoint-initdb.d)
      - name: Start DB with docker compose
        run: docker compose up -d db

      # Attends que Postgres soit prêt
      - name: Wait for DB
        run: |
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U docker -d questmaker && exit 0
            sleep 2
          done
          exit 1

      # Lance tes tests en donnant l'URL de ta DB
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://docker:docker@localhost:5432/questmaker
        run: |
          bash -lc 'shopt -s globstar nullglob; npx tsx --test test/integration/**/*.test.ts'

      # Nettoyage
      - name: Shutdown
        if: always()
        run: docker compose down -v
