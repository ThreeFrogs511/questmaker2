version: '3.9'

services:
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./dump_utf8.sql:/docker-entrypoint-initdb.d/dump.sql
      - pgdata:/var/lib/postgresql/data

    networks:
      - questmaker_net
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: questmaker_app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    networks:
      - questmaker_net

volumes:
  pgdata:

networks:
  questmaker_net:
    driver: bridge
